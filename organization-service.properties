#spring.application.name=organization-service
spring.datasource.url=jdbc:mysql://${hostname}:${organization_machine_port}/${organization_db_name}
spring.datasource.username=${organization_db_user}
spring.datasource.password=${organization_db_password}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

server.port=${server_port}

eureka.instance.client.serverUrl.defaultZone=${eureka_server_url}

spring.boot.message=Hello, organization Service Spring Cloud Bus Demo!